<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxford 3000 Communication - 40 Topics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh thanh cuộn gọn đẹp */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .word-chip:hover { background-color: #e0e7ff; color: #4338ca; transform: translateY(-1px); }
        .speaking-card { border-color: #4f46e5 !important; background-color: #eef2ff !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col overflow-hidden select-none">

    <!-- HEADER GỌN GÀNG -->
    <header class="bg-indigo-700 text-white shadow-md py-3 px-4 shrink-0">
        <div class="max-w-4xl mx-auto flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <span class="bg-amber-400 text-indigo-950 font-black px-2 py-0.5 rounded text-sm">OXFORD 3000</span>
                <h1 class="text-base sm:text-lg font-bold tracking-tight">40 Topics Giao Tiếp Phản Xạ</h1>
            </div>

            <!-- Điều hướng Topic: Trước / Dropdown / Sau -->
            <div class="flex items-center gap-1.5 w-full sm:w-auto">
                <button onclick="prevTopic()" class="bg-indigo-800 hover:bg-indigo-600 px-2.5 py-1.5 rounded-lg text-xs font-bold transition" title="Topic trước">◀</button>
                <select id="topicSelect" onchange="switchTopic(this.value)" class="flex-grow sm:w-72 bg-indigo-900 text-white text-xs sm:text-sm font-medium py-1.5 px-3 rounded-lg border border-indigo-500 focus:outline-none focus:ring-2 focus:ring-amber-400">
                    <!-- Tự động nạp 40 Topic -->
                </select>
                <button onclick="nextTopic()" class="bg-indigo-800 hover:bg-indigo-600 px-2.5 py-1.5 rounded-lg text-xs font-bold transition" title="Topic tiếp theo">▶</button>
            </div>
        </div>
    </header>

    <!-- THANH CÔNG CỤ ĐIỀU KHIỂN -->
    <div class="bg-white border-b border-slate-200 py-2.5 px-4 shrink-0 shadow-xs">
        <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span id="topicBadge" class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded-full">Topic 1/40</span>
                <span id="sentenceCount" class="text-xs text-slate-500 font-medium">10 câu thoại</span>
            </div>

            <!-- Các nút chức năng -->
            <div class="flex flex-wrap items-center gap-1.5">
                <button onclick="playAllDialogues()" id="btnPlayAll" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition shadow-xs flex items-center gap-1">
                    <span>▶ Nghe Tất Cả (0.8x)</span>
                </button>
                <button onclick="toggleState('chunk')" id="btnChunk" class="bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition">
                    Cụm 3-4 từ: BẬT
                </button>
                <button onclick="toggleState('ipa')" id="btnIPA" class="bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition">
                    IPA: BẬT
                </button>
                <button onclick="toggleState('vn')" id="btnVN" class="bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition">
                    Nghĩa: BẬT
                </button>
            </div>
        </div>
    </div>

    <!-- KHUNG NỘI DUNG CHÍNH (CUỘN GỌN TRONG KHUNG, KHÔNG TRẢI DÀI TRANG) -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-3 sm:p-4 overflow-hidden flex flex-col">
        <!-- Hướng dẫn nhỏ -->
        <div class="text-xs text-slate-500 mb-2 flex justify-between items-center px-1 shrink-0">
            <span>💡 <b>Mẹo:</b> Bấm vào bất kỳ từ nào trong câu để xem Phiên âm IPA & Nghĩa tiếng Việt của riêng từ đó.</span>
        </div>

        <!-- Danh sách hội thoại cuộn độc lập -->
        <div id="dialogueContainer" class="custom-scroll flex-grow overflow-y-auto space-y-2.5 pr-1 pb-16">
            <!-- Các câu hội thoại render tại đây -->
        </div>
    </main>

    <!-- POPUP TRA TỪ NHANH KHI BẤM VÀO CHỮ -->
    <div id="wordPopup" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-lg bg-slate-900 text-white p-3.5 rounded-2xl shadow-2xl border border-slate-700 transition-all duration-200 opacity-0 pointer-events-none translate-y-4 z-50">
        <div class="flex justify-between items-center gap-3">
            <div class="flex-grow">
                <div class="flex items-baseline gap-2 flex-wrap">
                    <span id="popupWord" class="text-lg font-extrabold text-amber-400 tracking-wide">Word</span>
                    <span id="popupIpa" class="text-xs font-mono text-indigo-300 bg-slate-800 px-2 py-0.5 rounded">/ipa/</span>
                    <span id="popupType" class="text-[11px] text-slate-400 italic">(loại từ)</span>
                </div>
                <p id="popupMeaning" class="text-sm text-slate-100 font-medium mt-1">Nghĩa tiếng Việt</p>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <button id="popupSpeakBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2 rounded-xl text-xs font-bold transition">
                    🔊 0.8x
                </button>
                <button onclick="closePopup()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl text-xs">✕</button>
            </div>
        </div>
    </div>

        // =========================================================================
        // PHẦN 3: HỆ THỐNG XỬ LÝ GIAO DIỆN & ÂM THANH (KHÔNG CẦN CHỈNH SỬA)
        // =========================================================================
        let currentTopicIndex = 0;
        let showChunk = true;
        let showIPA = true;
        let showVN = true;
        let isPlayingAll = false;

        window.onload = function() {
            renderDropdown();
            loadTopicByIndex(0);
        };

        function renderDropdown() {
            const select = document.getElementById('topicSelect');
            select.innerHTML = '';
            topicsData.forEach((topic, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.textContent = topic.title;
                select.appendChild(opt);
            });
        }

        function switchTopic(index) {
            stopSpeech();
            currentTopicIndex = parseInt(index);
            loadTopicByIndex(currentTopicIndex);
        }

        function prevTopic() {
            if (currentTopicIndex > 0) {
                switchTopic(currentTopicIndex - 1);
                document.getElementById('topicSelect').value = currentTopicIndex;
            }
        }

        function nextTopic() {
            if (currentTopicIndex < topicsData.length - 1) {
                switchTopic(currentTopicIndex + 1);
                document.getElementById('topicSelect').value = currentTopicIndex;
            }
        }

        // Tách mọi từ trong câu thành nút bấm tra từ tự động
        function buildClickableSentence(sentence) {
            const tokens = sentence.split(' ');
            return tokens.map(token => {
                // Lọc bỏ dấu câu để tra trong wordBank
                const cleanWord = token.replace(/[^a-zA-Z']/g, "").toLowerCase();
                const safeToken = token.replace(/'/g, "\\'");
                return `<span onclick="inspectWord('${cleanWord}', '${safeToken}')" class="word-chip cursor-pointer px-1 py-0.5 rounded transition inline-block">${token}</span>`;
            }).join(' ');
        }

        function loadTopicByIndex(idx) {
            const topic = topicsData[idx];
            if (!topic) return;

            document.getElementById('topicBadge').textContent = `Topic ${topic.id} / 40`;
            document.getElementById('sentenceCount').textContent = `${topic.dialogues.length} câu thoại`;

            const container = document.getElementById('dialogueContainer');
            container.innerHTML = '';

            topic.dialogues.forEach((line, lineIdx) => {
                const isSpeakerA = line.speaker === "A";
                const card = document.createElement('div');
                card.id = `dialogue-card-${lineIdx}`;
                card.className = `bg-white rounded-xl p-3.5 shadow-xs border ${isSpeakerA ? 'border-slate-200' : 'border-indigo-100 bg-indigo-50/20'} transition duration-200`;

                const clickableSentence = buildClickableSentence(line.text);
                const safeTextForSpeech = line.text.replace(/'/g, "\\'");

                card.innerHTML = `
                    <div class="flex justify-between items-center gap-2 mb-1.5">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-extrabold ${isSpeakerA ? 'bg-indigo-600 text-white' : 'bg-amber-500 text-slate-950'}">
                                ${line.speaker}
                            </span>
                            <span class="text-xs font-semibold text-slate-400">Câu #${lineIdx + 1}</span>
                        </div>
                        <button onclick="speakSingle('${safeTextForSpeech}', ${lineIdx})" class="bg-indigo-50 hover:bg-indigo-600 hover:text-white text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-lg border border-indigo-200 transition flex items-center gap-1">
                            🔊 0.8x
                        </button>
                    </div>

                    <!-- Câu tiếng Anh bấm được từng chữ -->
                    <div class="text-base sm:text-lg font-bold text-slate-800 leading-snug tracking-tight mb-1.5">
                        ${clickableSentence}
                    </div>

                    <!-- Phân tách cụm 3-4 từ (Chunking) -->
                    <div class="chunk-row text-xs bg-amber-50 text-amber-900 border border-amber-200/70 px-2.5 py-1.5 rounded-lg mb-1 font-medium ${showChunk ? '' : 'hidden'}">
                        🧩 ${line.chunks}
                    </div>

                    <!-- Phiên âm IPA -->
                    <div class="ipa-row text-xs font-mono text-indigo-600 mb-1 ${showIPA ? '' : 'hidden'}">
                        ${line.ipa}
                    </div>

                    <!-- Nghĩa Tiếng Việt -->
                    <div class="vn-row text-sm text-slate-600 font-medium ${showVN ? '' : 'hidden'}">
                        💬 ${line.vn}
                    </div>
                `;
                container.appendChild(card);
            });

            container.scrollTop = 0;
        }

        // Bấm vào 1 từ bất kỳ trong câu để xem IPA + Nghĩa
        function inspectWord(cleanKey, rawDisplayWord) {
            const info = wordBank[cleanKey];
            const popup = document.getElementById('wordPopup');

            document.getElementById('popupWord').textContent = rawDisplayWord.replace(/[.,?!]/g, "");
            if (info) {
                document.getElementById('popupIpa').textContent = info.ipa;
                document.getElementById('popupType').textContent = `(${info.type})`;
                document.getElementById('popupMeaning').textContent = info.vn;
            } else {
                document.getElementById('popupIpa').textContent = `/${cleanKey}/`;
                document.getElementById('popupType').textContent = `(từ vựng)`;
                document.getElementById('popupMeaning').textContent = "Đang cập nhật trong kho từ điển...";
            }

            // Gán sự kiện đọc riêng từ đó với tốc độ 0.8
            const speakBtn = document.getElementById('popupSpeakBtn');
            speakBtn.onclick = function() {
                speakWordOnly(cleanKey);
            };

            popup.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-4');
            speakWordOnly(cleanKey); // Tự phát âm từ đó khi bấm vào
        }

        function closePopup() {
            const popup = document.getElementById('wordPopup');
            popup.classList.add('opacity-0', 'pointer-events-none', 'translate-y-4');
        }

        // Đọc 1 từ đơn
        function speakWordOnly(word) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US';
            u.rate = 0.8;
            window.speechSynthesis.speak(u);
        }

        // Đọc 1 câu thoại với hiệu ứng sáng khung
        function speakSingle(text, cardIdx) {
            stopSpeech();
            highlightCard(cardIdx);
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US';
            u.rate = 0.8;
            u.onend = () => clearHighlight();
            window.speechSynthesis.speak(u);
        }

        // Nghe liên tục toàn bộ hội thoại trong Topic
        function playAllDialogues() {
            if (isPlayingAll) {
                stopSpeech();
                return;
            }
            const topic = topicsData[currentTopicIndex];
            if (!topic) return;

            isPlayingAll = true;
            const btn = document.getElementById('btnPlayAll');
            btn.innerHTML = `<span>⏹ Dừng Nghe</span>`;
            btn.classList.replace('bg-emerald-600', 'bg-rose-600');

            let idx = 0;
            function playNext() {
                if (!isPlayingAll || idx >= topic.dialogues.length) {
                    stopSpeech();
                    return;
                }
                highlightCard(idx);
                const cardEl = document.getElementById(`dialogue-card-${idx}`);
                if (cardEl) cardEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                const u = new SpeechSynthesisUtterance(topic.dialogues[idx].text);
                u.lang = 'en-US';
                u.rate = 0.8;
                u.onend = () => {
                    idx++;
                    setTimeout(playNext, 400);
                };
                window.speechSynthesis.speak(u);
            }
            playNext();
        }

        function stopSpeech() {
            isPlayingAll = false;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            clearHighlight();
            const btn = document.getElementById('btnPlayAll');
            if (btn) {
                btn.innerHTML = `<span>▶ Nghe Tất Cả (0.8x)</span>`;
                btn.classList.replace('bg-rose-600', 'bg-emerald-600');
            }
        }

        function highlightCard(idx) {
            clearHighlight();
            const card = document.getElementById(`dialogue-card-${idx}`);
            if (card) card.classList.add('speaking-card');
        }

        function clearHighlight() {
            document.querySelectorAll('[id^="dialogue-card-"]').forEach(el => {
                el.classList.remove('speaking-card');
            });
        }

        // Bật / Tắt hiển thị Cụm từ, IPA, Nghĩa Tiếng Việt
        function toggleState(type) {
            if (type === 'chunk') {
                showChunk = !showChunk;
                updateToggleUI('btnChunk', 'Cụm 3-4 từ', showChunk, '.chunk-row');
            } else if (type === 'ipa') {
                showIPA = !showIPA;
                updateToggleUI('btnIPA', 'IPA', showIPA, '.ipa-row');
            } else if (type === 'vn') {
                showVN = !showVN;
                updateToggleUI('btnVN', 'Nghĩa', showVN, '.vn-row');
            }
        }

        function updateToggleUI(btnId, label, state, selector) {
            const btn = document.getElementById(btnId);
            btn.textContent = `${label}: ${state ? 'BẬT' : 'TẮT'}`;
            btn.className = state 
                ? "bg-indigo-50 text-indigo-700 border border-indigo-200 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition"
                : "bg-slate-200 text-slate-600 border border-slate-300 text-xs font-semibold px-2.5 py-1.5 rounded-lg transition";
            
            document.querySelectorAll(selector).forEach(el => {
                if (state) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
